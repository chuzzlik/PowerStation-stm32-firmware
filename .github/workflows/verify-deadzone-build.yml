name: Verify deadzone firmware build

on:
  push:
    branches:
      - feature

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4
        with:
          ref: feature

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/verify-deadzone-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-deadzone-build.yml
          git commit -m "Remove temporary deadzone firmware build workflow [skip ci]"
          git push origin feature
